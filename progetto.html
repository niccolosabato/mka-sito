  // vedono titolo e comandi e poi spariscono. Ripiego dopo 4 secondi se js/progetto.js non parte.
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.documentElement.classList.add("pj-enter");
    setTimeout(function () { if (!window.mkaProgetto) document.documentElement.classList.remove("pj-enter"); }, 4000);
  }
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
</script>
